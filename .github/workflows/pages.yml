name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main, master, claude/vigilant-hamilton-kwg77b]
    paths: ['web/**', 'tools/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The Slovo models are ~140 MB each, too big for git, so they are
      # downloaded at deploy time and published next to the page.
      - name: Download Slovo models
        run: |
          mkdir -p web/models
          base=https://rndml-team-cv.obs.ru-moscow-1.hc.sbercloud.ru/datasets/slovo/models/mvit/onnx
          for m in mvit16-4 mvit32-2; do
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o "web/models/$m.onnx" "$base/$m.onnx"
          done

      - name: Create GPU (WebGPU) versions of the models
        run: |
          pip install onnx numpy
          for m in mvit16-4 mvit32-2; do
            python tools/convert_webgpu.py "web/models/$m.onnx" "web/models/$m-webgpu.onnx"
          done
          ls -la web/models

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
